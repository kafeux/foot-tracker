<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matchs TV</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans select-none pb-8">

  <!-- Header -->
  <header class="p-4 bg-slate-800 border-b border-slate-700 flex items-center justify-between sticky top-0 shadow-md z-10">
    <button id="btn-back" class="hidden text-sm bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-lg">← Retour</button>
    <h1 id="header-title" class="text-base font-bold tracking-wide">Programme TV Foot</h1>
    <button id="btn-refresh" class="text-sm bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-lg active:scale-95 transition">🔄</button>
  </header>

  <!-- Page d'accueil : Choix du pays -->
  <main id="home-view" class="p-4 grid grid-cols-2 gap-3 max-w-md mx-auto">
    <div onclick="openCountry('France')" class="bg-slate-800 hover:bg-slate-750 p-5 rounded-2xl flex flex-col items-center justify-center cursor-pointer border border-slate-700 active:scale-95 transition shadow">
      <span class="text-4xl">🇫🇷</span>
      <span class="mt-2 font-semibold text-sm">France</span>
    </div>
    <div onclick="openCountry('Angleterre')" class="bg-slate-800 hover:bg-slate-750 p-5 rounded-2xl flex flex-col items-center justify-center cursor-pointer border border-slate-700 active:scale-95 transition shadow">
      <span class="text-4xl">🇬🇧</span>
      <span class="mt-2 font-semibold text-sm">Angleterre</span>
    </div>
    <div onclick="openCountry('Espagne')" class="bg-slate-800 hover:bg-slate-750 p-5 rounded-2xl flex flex-col items-center justify-center cursor-pointer border border-slate-700 active:scale-95 transition shadow">
      <span class="text-4xl">🇪🇸</span>
      <span class="mt-2 font-semibold text-sm">Espagne</span>
    </div>
    <div onclick="openCountry('Italie')" class="bg-slate-800 hover:bg-slate-750 p-5 rounded-2xl flex flex-col items-center justify-center cursor-pointer border border-slate-700 active:scale-95 transition shadow">
      <span class="text-4xl">🇮🇹</span>
      <span class="mt-2 font-semibold text-sm">Italie</span>
    </div>
    <div onclick="openCountry('Allemagne')" class="bg-slate-800 hover:bg-slate-750 p-5 rounded-2xl flex flex-col items-center justify-center cursor-pointer border border-slate-700 active:scale-95 transition shadow">
      <span class="text-4xl">🇩🇪</span>
      <span class="mt-2 font-semibold text-sm">Allemagne</span>
    </div>
    <div onclick="openCountry('Europe')" class="bg-slate-800 hover:bg-slate-750 p-5 rounded-2xl flex flex-col items-center justify-center cursor-pointer border border-slate-700 active:scale-95 transition shadow">
      <span class="text-4xl">🇪🇺</span>
      <span class="mt-2 font-semibold text-sm">Europe</span>
    </div>
    <div onclick="openCountry('Autres')" class="col-span-2 bg-slate-800 hover:bg-slate-750 p-4 rounded-2xl flex items-center justify-center gap-3 cursor-pointer border border-slate-700 active:scale-95 transition shadow">
      <span class="text-2xl">🌍</span>
      <span class="font-semibold text-sm">Autres Ligues</span>
    </div>
  </main>

  <!-- Page liste des matchs -->
  <main id="matches-view" class="p-4 space-y-3 max-w-md mx-auto hidden">
    <div id="matches-list" class="space-y-2.5"></div>
  </main>

  <script>
    const DATA_URL = "https://raw.githubusercontent.com/kafeux/foot-tracker/main/matches.json";
    let matchesData = {};

    async function loadData() {
      try {
        const res = await fetch(DATA_URL + '?t=' + Date.now());
        matchesData = await res.json();
      } catch (err) {
        console.error("Erreur de chargement", err);
      }
    }

    function openCountry(country) {
      document.getElementById('home-view').classList.add('hidden');
      document.getElementById('matches-view').classList.remove('hidden');
      document.getElementById('btn-back').classList.remove('hidden');
      document.getElementById('header-title').innerText = country;

      const listContainer = document.getElementById('matches-list');
      listContainer.innerHTML = '';

      const matches = matchesData[country] || [];
      if (matches.length === 0) {
        listContainer.innerHTML = '<p class="text-center text-slate-400 py-12 text-sm">Aucun match programmé pour le moment.</p>';
        return;
      }

      matches.forEach(m => {
        const card = document.createElement('div');
        card.className = "bg-slate-800 p-3.5 rounded-xl border border-slate-700 shadow flex justify-between items-center";
        card.innerHTML = `
          <div class="pr-2 flex-1 min-w-0">
            <p class="font-medium text-white text-sm break-words">${m.affiche}</p>
          </div>
          <span class="bg-blue-600/20 text-blue-400 border border-blue-500/30 px-2.5 py-1 rounded-lg text-xs font-mono font-bold whitespace-nowrap ml-2">
            ${m.heure}
          </span>
        `;
        listContainer.appendChild(card);
      });
    }

    document.getElementById('btn-back').onclick = () => {
      document.getElementById('matches-view').classList.add('hidden');
      document.getElementById('home-view').classList.remove('hidden');
      document.getElementById('btn-back').classList.add('hidden');
      document.getElementById('header-title').innerText = "Programme TV Foot";
    };

    document.getElementById('btn-refresh').onclick = async () => {
      await loadData();
      const currentTitle = document.getElementById('header-title').innerText;
      if (currentTitle !== "Programme TV Foot") {
        openCountry(currentTitle);
      }
    };

    loadData();
  </script>
</body>
</html>
